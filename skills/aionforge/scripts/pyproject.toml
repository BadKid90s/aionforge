[project]
name = "aionforge"
version = "0.3.0"
description = "货坊 AionForge — 女装电商 AI 工作流（Skill 编排 + 薄 CLI）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pillow>=13.0.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
forge = "aionforge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["aionforge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
